<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>名片</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <main class="card">
    <!-- 头像：替换 src 为 ./media/你的图片名（先在云盘 media/ 上传） -->
    <img class="avatar" src="./media/avatar.png" alt="头像"
         onerror="this.style.display='none'" />
    <h1 id="site-title"></h1>
    <p id="site-description" class="bio"></p>

    <!-- 社交链接：直接编辑下面 <a> 的文字与 href -->
    <nav id="social" class="social">
      <a href="https://github.com/yourname" target="_blank" rel="noopener">GitHub</a>
      <a href="mailto:you@example.com">邮箱</a>
      <a href="https://example.com/blog" target="_blank" rel="noopener">博客</a>
    </nav>

    <!-- 最近文章 -->
    <section class="posts">
      <h2>最近更新</h2>
      <ul id="post-list">
        <li class="loading-tip">加载中…</li>
      </ul>
    </section>
  </main>

  <footer class="footer">
    <p>© <span id="year"></span> <span id="footer-title"></span> · 由 iplat 驱动</p>
  </footer>

  <script src="./app.js"></script>
</body>
</html>
