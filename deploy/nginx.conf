# ===== P4E T64：访问日志脱敏（D56） =====
# nginx 默认的 combined 格式包含 $request，会把完整 query 明文写进 access_log，
# 其中 `?sid=`（P4d 分享提取码通过后的短期访问凭证）与密码类参数属敏感信息，必须打码。
# 口径（二选一）：
#   A. 不输出查询串（本文件采用）：log_format 里不含 $request，改用 $request_method + $uri 组装，
#      任何 query 都不落盘，最简最稳；
#   B. 保留部分 query 并对敏感项打码：在 http 上下文加
#        map $arg_sid $sid_masked { default "***"; }
#        map $arg_password $pwd_masked { default "***"; }
#      再把 log_format 的 $request 换成 "$request_method $uri?sid=$sid_masked&password=$pwd_masked"，
#      注意仅适用于已知参数名的场景。
log_format iplat_main '$remote_addr - $remote_user [$time_local] '
                      '"$request_method $uri $server_protocol" $status $body_bytes_sent '
                      '"$http_referer" "$http_user_agent"';

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 100m;

    # 使用上面的脱敏格式（不记录查询串）
    access_log /var/log/nginx/access.log iplat_main;

    # SPA 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 后端 API（含开放层 /api/open/*、AI 对话 SSE、文件流）
    location /api/ {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        # SSE（AI 对话 / 工具确认）必须关闭缓冲，否则流式输出会被缓存
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}
