# 生产部署编排（腾讯云轻量服务器 /opt/iplat）
# CI/CD：GitHub Actions 会把本文件与构建产物一起上传到服务器并调用 deploy.sh
services:
  mysql:
    image: mysql:8.0
    container_name: iplat-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: iplat
      MYSQL_USER: iplat
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      TZ: Asia/Shanghai
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', '127.0.0.1', '-uroot', '-p${MYSQL_ROOT_PASSWORD}']
      interval: 5s
      timeout: 5s
      retries: 30
    networks:
      - iplat

  redis:
    image: redis:7-alpine
    container_name: iplat-redis
    restart: always
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - iplat

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: iplat-api
    restart: always
    env_file:
      - apps/api/.env
    volumes:
      - api_uploads:/app/apps/api/uploads
      - ./docs/PLATFORM-GUIDE.md:/app/docs/PLATFORM-GUIDE.md:ro
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - iplat

  nginx:
    image: nginx:1.28-alpine
    container_name: iplat-nginx
    restart: always
    ports:
      - '80:80'
    volumes:
      - ./apps/web/dist:/usr/share/nginx/html:ro
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
    networks:
      - iplat

volumes:
  mysql_data:
  redis_data:
  api_uploads:

networks:
  iplat:
